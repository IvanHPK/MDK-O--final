<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Служба доставки{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .navbar-brand {
            font-weight: bold;
        }

        .card {
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>

<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">

            <a class="navbar-brand"
               href="{% url 'delivery_service:home' %}">
                <i class="bi bi-truck"></i> Служба доставки
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                    aria-label="Открыть меню">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">

                    <li class="nav-item">
                        <a class="nav-link"
                           href="{% url 'delivery_service:order_list' %}">
                            <i class="bi bi-list-ul"></i> Заказы
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           href="{% url 'delivery_service:order_create' %}">
                            <i class="bi bi-plus-circle"></i> Добавить
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           href="{% url 'delivery_service:stats' %}">
                            <i class="bi bi-graph-up"></i> Статистика
                        </a>
                    </li>

                </ul>
            </div>

        </div>
    </nav>
</header>

<main class="container my-4">
    {% block content %}{% endblock %}
</main>

<footer class="bg-dark text-light py-4 mt-5">
    <div class="container text-center">
        <p class="mb-0">
            Служба доставки
        </p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

{% block extra_js %}{% endblock %}

</body>
</html>
